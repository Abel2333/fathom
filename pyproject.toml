[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fathom"
version = "0.1.0"
description = "Deep Research Agent built with LangGraph and LangChain"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "langchain>=1.2.3",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=1.1.7",
    "langfuse>=3.12.0",
    "langgraph>=1.0.6",
    "logger>=1.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "tavily-python>=0.7.17",
]

[project.scripts]
fathom = "fathom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom"]

[dependency-groups]
dev = [
    "ruff>=0.14.11",
]
