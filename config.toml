# ==========================================
# Deep Research Agent 配置文件 (LangGraph)
# ==========================================

[project]
name = "Fathom"  # 假设你选了 Fathom 这个名字
version = "0.1.0"
debug_mode = true  # 是否打印详细的 Graph 状态转换日志

# ------------------------------------------
# 1. LLM (大模型) 配置
# 用于规划(Planner)和写作(Writer)
# ------------------------------------------
[llm]
provider = "deepseek"  # 选项: openai, anthropic, ollama
model_name = "deepseek-reasoner"  # 建议使用长窗口模型
summary_model_name = "deepseek-chat"  # 专用于摘要/压缩的模型
temperature = 0.0  # 研究任务建议设为 0 以保证严谨性
timeout = 60  # 请求超时时间(秒)
# api_key 建议从环境变量读取，不要写在文件里

# ------------------------------------------
# 2. Search (搜索引擎) 配置
# ------------------------------------------
[search]
provider = "tavily"  # 选项: tavily (推荐, 对 Agent 优化最好), google_serper, duckduckgo
max_results = 5  # 每次搜索返回的最大结果数
exclude_domains = ["youtube.com", "bilibili.com"]  # 排除视频网站，专注于文本

# ------------------------------------------
# 3. Research Strategy (研究策略 - 核心)
# 这些参数决定了 LangGraph 的结构和运行逻辑
# ------------------------------------------
[research]
max_depth = 3  # 研究深度：迭代多少轮？(Query -> Sub-query -> Sub-sub-query)
max_sub_questions = 3  # 广度：每一轮针对一个问题，最多生成多少个子问题？
total_query_limit = 20  # 安全阀：整个运行过程中允许的最大搜索次数，防止 API 费用爆炸
# LangGraph 特有配置
recursion_limit = 50  # Graph 的最大递归步数，防止死循环
concurrency = 4  # 并发数：同时抓取或搜索的线程数

# ------------------------------------------
# 4. Scraping (网页抓取)
# ------------------------------------------
[scraping]
user_agent = "FathomResearchBot/1.0"
timeout = 10
summary_model = "gpt-4o-mini"  # 用于总结单个长网页的模型 (省钱策略)
chunk_size = 4000  # 文本分块大小
summary_max_chars = 4000  # 单次摘要时传给模型的最大字符数上限

# ------------------------------------------
# 5. Output (报告输出)
# ------------------------------------------
[output]
dir = "./reports"
format = "markdown"  # 选项: markdown, pdf
language = "Chinese"  # 强制输出语言
tone = "professional"  # 选项: professional(专业), academic(学术), easy-to-read(通俗)
include_citations = true  # 是否包含引用来源链接
